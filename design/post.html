<!doctype html>
<html lang="ja" data-size="std">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>のこす手帖 封筒と切手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* ───────── インクは2色＋紙。濃淡（網）だけで変化をつける ───────── */
:root{
  --paper:#FFFFFF;
  --red:#C8251B;      /* ポストの朱。白地 5.6:1 */
  --blue:#1F3C9E;     /* 群青。文字・罫線・消印。白地 9.5:1 */
  --bt:#E6EBF7;       /* 群青の網 12% */
  --bt2:#D3DCF2;      /* 群青の網 20%（ストックブックの帯） */
  --rt:#FBE3E0;       /* 朱の網 12% */
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
  --display:"Dela Gothic One","BIZ UDPGothic",sans-serif;
  --spring:cubic-bezier(.34,1.7,.5,1);
  color-scheme:light;
}
html{font-size:18px;-webkit-text-size-adjust:100%}
html[data-size="lg"]{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:#F1F3FA;color:var(--blue);font-family:var(--ui);line-height:1.65;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:6px}
h1,h2,.headline,.to,.nm{word-break:auto-phrase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── 机（PC）：中央にスマホの枠、右に画面の切り替え ───────── */
.desk{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}
.phone-slot{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;background:var(--paper);border:3px solid var(--blue);border-radius:46px;overflow:hidden;isolation:isolate}
.panel{width:260px;flex:none;display:grid;gap:18px;align-content:start;font-size:16px}
.panel h1{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.35;letter-spacing:.02em}
.panel h2{margin:0;font-size:16px;font-weight:700}
.panel ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.panel ol button{width:100%;min-height:48px;text-align:left;padding:8px 14px;border:2px solid var(--blue);border-radius:10px;background:#fff;font-size:16px;font-weight:700;display:flex;gap:10px;align-items:center}
.panel ol button .n{font-family:var(--display);font-weight:400;min-width:1.6em}
.panel ol button[aria-current="true"]{background:var(--blue);color:#fff}
.panel .seg{display:flex;border:2px solid var(--blue);border-radius:10px;overflow:hidden}
.panel .seg button{flex:1;min-height:48px;border:0;background:#fff;font-size:16px;font-weight:700}
.panel .seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.panel .plain{min-height:48px;border:2px solid var(--red);color:var(--red);background:#fff;border-radius:10px;font-weight:700;font-size:16px}
@media (max-width:760px){
  body{background:var(--paper)}
  .desk{display:block;padding:0}
  .panel{display:none}
  .phone-slot{width:100vw !important;height:100dvh !important}
  .phone{position:fixed;inset:0;width:100%;height:100dvh;border:0;border-radius:0;transform:none !important}
}

/* ───────── 画面 ───────── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);visibility:hidden;opacity:0}
.screen.on{visibility:visible;opacity:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:0 18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 6px 18px;min-height:64px}
.wordmark{font-family:var(--display);font-size:1.1rem;letter-spacing:.04em;line-height:1}
.sizebtn{min-height:48px;min-width:48px;padding:0 14px;border:2px solid var(--blue);border-radius:999px;background:#fff;font-weight:700;font-size:.9rem;white-space:nowrap}
.sizebtn b{font-family:var(--display);font-weight:400;margin-left:.3em}

/* 押すと少しつぶれて、ばねで戻る */
.press{transition:transform .42s var(--spring)}
.press:active{transform:scale(.96,.9);transition-duration:.07s;transition-timing-function:ease-out}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:56px;padding:.4em 1.3em;border-radius:14px;border:2.5px solid var(--blue);background:#fff;font-weight:700;font-size:1rem;line-height:1.3;text-align:center}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{border-color:transparent;background:var(--bt)}
.btn.wide{width:100%}

/* ───────── 切手 ───────── */
.stamp{display:block;filter:drop-shadow(0 0 .6px rgba(31,60,158,.55))}
.slot{display:flex;align-items:center;justify-content:center;border:2px dashed rgba(31,60,158,.62);border-radius:4px;font-family:var(--display);color:var(--blue)}

/* 航空便の縁 */
.airmail{background:repeating-linear-gradient(-45deg,var(--red) 0 11px,#fff 11px 17px,var(--blue) 17px 28px,#fff 28px 34px);padding:7px;border-radius:6px}
.airmail>.in{background:#fff;border-radius:2px;height:100%;position:relative}

/* ───────── 1 入口 ───────── */
#s-start{background:#fff}
.frame-stripe{position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(-45deg,var(--red) 0 11px,#fff 11px 17px,var(--blue) 17px 28px,#fff 28px 34px);z-index:3}
.frame-stripe.t{top:0}.frame-stripe.b{bottom:0}
.skip{position:absolute;top:22px;right:14px;z-index:5;min-height:48px;padding:0 18px;border-radius:999px;border:2px solid var(--blue);background:#fff;font-weight:700;font-size:.9rem}
.start-in{padding:30px 22px 30px}
.start-in .wordmark{font-size:1.25rem}
.poster{position:relative;height:330px;margin:14px -22px 6px}
.poster>*{position:absolute}
.p-env{left:34px;top:62px;width:316px;height:200px;transform:rotate(-5deg)}
.p-env .in{display:flex;flex-direction:column;justify-content:flex-end;padding:14px 18px}
.p-addr{font-size:17px;font-weight:700;line-height:1.5;border-bottom:2px solid var(--blue);padding-bottom:2px;width:62%}
.p-addr+.p-addr{margin-top:8px}
.p-s1{right:46px;top:66px;transform:rotate(3deg)}
.p-s2{left:-14px;top:18px;transform:rotate(-14deg)}
.p-s3{left:18px;top:236px;transform:rotate(9deg)}
.p-s4{right:-22px;top:228px;transform:rotate(-8deg)}
.p-pm{left:80px;top:86px;width:210px;transform:rotate(-8deg)}
.headline{font-family:var(--display);font-weight:400;font-size:1.72rem;line-height:1.38;margin:8px 0 18px;letter-spacing:.01em}
.headline span{display:block;overflow:hidden}
.headline span i{display:block;font-style:normal}
.rates{margin:0 0 22px;border-top:2px solid var(--blue)}
.rates div{display:grid;grid-template-columns:4.2em 1fr;gap:.6em;padding:.45em 0;border-bottom:1px solid rgba(31,60,158,.35);align-items:baseline}
.rates dt{font-weight:700;color:var(--red)}
.rates dd{margin:0}

/* ───────── 2 ホーム ───────── */
.hello{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 14px}
.hello h1{margin:0;font-size:1.3rem;line-height:1.35}
.today{position:relative;margin:0 0 30px}
.today .airmail{border-radius:8px}
.today .in{padding:18px 18px 18px;min-height:250px;display:flex;flex-direction:column}
.today .label{color:var(--red);font-weight:700;font-size:1rem;margin:0 0 4px}
.today h2{margin:0 98px 16px 0;font-size:1.45rem;line-height:1.4}
.today .slotwrap{position:absolute;top:14px;right:14px;width:74px;height:88px}
.today .slotwrap .slot{width:100%;height:100%}
.today .slotwrap .ghost-stamp{opacity:.28}
.today .slotwrap .pm-mini{position:absolute;left:-128px;top:40px;width:150px;pointer-events:none;transform:rotate(-8deg)}
.today .go{margin-top:auto}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px}
.sec-h h2{margin:0;font-size:1.15rem}
.count{font-family:var(--display);font-size:1.4rem;line-height:1}
.count small{font-family:var(--ui);font-weight:700;font-size:.9rem;margin-left:.2em}
.strip{display:flex;gap:8px;align-items:center;padding:12px 12px;background:var(--bt2);border-top:3px solid rgba(31,60,158,.35);border-radius:4px;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left;overflow:hidden}
.strip .more{margin-left:auto;font-weight:700;white-space:nowrap;padding-left:6px}
.links{margin:26px 0 24px;border-top:2px solid var(--blue)}
.links button{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:10px 4px;border:0;border-bottom:1px solid rgba(31,60,158,.35);background:none;text-align:left;font-weight:700;font-size:1.05rem;line-height:1.4}
.links button svg{flex:none}
.links button .chev{margin-left:auto}

/* タブ */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--blue);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:66px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.84rem;font-weight:700;position:relative;line-height:1.2;padding:6px 2px}
.tabs button[aria-current="page"]{color:var(--red)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:5px;background:var(--red);border-radius:0 0 3px 3px}

/* ───────── 3 書く ───────── */
.whead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.back{min-height:48px;min-width:48px;border:0;background:none;display:flex;align-items:center;gap:4px;font-weight:700;padding:0 6px}
.whead .where{flex:1;font-weight:700;font-size:.95rem;line-height:1.3}
.whead .tally{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.05rem}
.wq{padding:6px 18px 0}
.wq .label{color:var(--red);font-weight:700;margin:0}
.wq h1{font-size:1.45rem;line-height:1.42;margin:2px 0 6px}
.wq .hint{margin:0 0 14px}
.binsen{margin:0 14px 24px;padding:16px 16px 18px 26px;background:#fff;border:2px solid var(--blue);border-radius:4px;position:relative;
  background-image:linear-gradient(90deg,transparent 15px,rgba(200,37,27,.55) 15px 17px,transparent 17px),repeating-linear-gradient(180deg,transparent 0 calc(2.1em - 1px),rgba(31,60,158,.28) calc(2.1em - 1px) 2.1em)}
.field{display:grid;gap:4px;margin:0 0 14px}
.field>label,.field>.lab{font-weight:700}
.field input[type=text],.field input[type=date],.field textarea{width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--blue);border-radius:8px;background:#fff;font-size:1.05rem;line-height:1.5}
.field textarea{min-height:120px;resize:vertical}
.field ::placeholder{color:#5A6BAF;opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:52px;padding:8px 14px;border:2px solid var(--blue);border-radius:999px;background:#fff;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-align:left;line-height:1.35}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--blue);color:#fff}
.chip .mk{width:1.1em;height:1.1em;flex:none;border:2px solid currentColor;border-radius:50%;display:inline-grid;place-items:center}
.chip[aria-pressed="true"] .mk::after,.chip[aria-checked="true"] .mk::after{content:"";width:.45em;height:.7em;border:solid currentColor;border-width:0 3px 3px 0;transform:translateY(-.08em) rotate(45deg)}
.wfoot{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--blue);background:#fff}
.wfoot .btn{padding:.3em .5em}
.tally .num{display:inline-block}

/* ───────── 4 封をする ───────── */
#s-seal{background:#fff;overflow:hidden}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:40px 18px 40px;overflow-y:auto}
.env-wrap{perspective:900px;width:300px;height:240px;position:relative;flex:none;margin-top:110px}
.env{position:absolute;left:0;top:44px;width:300px;height:196px;transform-style:preserve-3d}
.env .back,.env .front{position:absolute;inset:0}
.env .back .inside{position:absolute;inset:0;background:var(--bt);border:2px solid var(--blue);border-radius:6px}
.letter{position:absolute;left:22px;right:22px;top:-150px;height:200px;background:#fff;border:2px solid var(--blue);border-radius:3px;padding:12px 14px 12px 22px;font-size:15px;line-height:1.6;overflow:hidden;
  background-image:linear-gradient(90deg,transparent 11px,rgba(200,37,27,.55) 11px 13px,transparent 13px),repeating-linear-gradient(180deg,transparent 0 23px,rgba(31,60,158,.25) 23px 24px)}
.letter b{display:block;font-size:15px}
.letter p{margin:2px 0 0;font-size:16px}
.pocket,.flap{position:absolute;left:0;top:0;width:300px;height:196px;pointer-events:none}
.flap{transform-origin:50% 0;transform:scaleY(-1)}
.env .front{display:none}
.env .front .airmail{height:100%;border-radius:8px}
.env .front .in{padding:16px 16px 14px;display:flex;flex-direction:column;justify-content:flex-end}
.to{font-size:17px;line-height:1.45;font-weight:700;border-bottom:2px solid var(--blue);padding:4px 0 2px;width:100%;display:flex;justify-content:space-between;gap:6px}
.to span{color:var(--red);font-size:16px;white-space:nowrap}
.env .stamp-on{position:absolute;right:16px;top:14px;opacity:0}
.env .pm-on{position:absolute;left:70px;top:30px;width:170px;opacity:0;pointer-events:none}
.seal-done{text-align:center;margin-top:30px;opacity:0;max-width:340px}
.seal-done h1{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.35;margin:0 0 6px}
.seal-done p{margin:0 0 22px;font-size:1.05rem}
.seal-done p b{font-family:var(--display);font-weight:400;font-size:1.3em;color:var(--red)}
.seal-done .row{display:grid;gap:10px}

/* ───────── 切手帳 ───────── */
.page-h{padding:6px 18px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.page-h h1{margin:0;font-size:1.4rem;line-height:1.3}
.book{padding:6px 14px 30px}
.cat{margin:16px 0 0}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin:0 4px 6px}
.cat-h .c{font-family:var(--display);font-weight:400}
.pocketrow{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--bt2);border-top:3px solid rgba(31,60,158,.35);border-radius:4px}
.pocketrow button{border:0;background:none;padding:0;min-width:48px;min-height:48px}
.pocketrow .slot{width:50px;height:60px;font-size:18px;background:rgba(255,255,255,.55)}

/* ───────── 5 誰に・いつ ───────── */
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px 4px}
.person{min-height:96px;border:2.5px solid var(--blue);border-radius:6px;background:#fff;text-align:left;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.person .zip{display:flex;gap:3px;margin-bottom:6px}
.person .zip i{width:11px;height:15px;border:1.5px solid var(--red);display:block}
.person b{font-size:1.05rem;line-height:1.3}
.person small{font-size:.88rem;font-weight:700}
.person[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.person[aria-pressed="true"]::after{content:"選択中";position:absolute;bottom:8px;right:8px;font-size:.85rem;font-weight:700;background:var(--red);color:#fff;padding:1px 8px;border-radius:999px}
.who-line{padding:14px 18px 6px;margin:0;font-weight:700}
.rows{margin:0 14px;border-top:2px solid var(--blue)}
.rows button{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 4px;border:0;border-bottom:1px solid rgba(31,60,158,.35);background:none;text-align:left;line-height:1.35}
.rows .nmw{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}
.rows .nm{font-weight:700}
.when{display:inline-block;border:2px solid currentColor;border-radius:4px;padding:2px 8px;font-weight:700;font-size:.9rem;white-space:nowrap;transform:rotate(-2deg)}
.when.now{color:var(--red)}
.when.never{color:#3D4F8F;border-style:dashed}
.sheet-btn{padding:20px 14px 30px}

.overlay{position:absolute;inset:0;z-index:20;display:none}
.overlay.on{display:block}
.overlay .dim{position:absolute;inset:0;background:rgba(31,60,158,.38)}
.bsheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--blue);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88%;overflow:auto}
.bsheet h2{font-size:1.15rem;margin:0 0 12px;line-height:1.45}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 14px;margin:0 0 8px;border:2px solid var(--blue);border-radius:10px;background:#fff;text-align:left;font-weight:700;line-height:1.35}
.opt .mk{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--blue);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"]{background:var(--blue);color:#fff}
.opt[aria-checked="true"] .mk{border-color:#fff}
.opt[aria-checked="true"] .mk::after{content:"";width:8px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}

/* 受け渡しシート見本 */
.paper{margin:8px 14px 18px;border:2px solid var(--blue);background:#fff;padding:18px 16px 16px;position:relative}
.paper::before{content:"";position:absolute;left:-2px;right:-2px;top:-10px;height:10px;background:radial-gradient(circle at 6px 10px,#fff 4px,transparent 4.5px) 0 0/12px 10px repeat-x}
.paper h2{margin:0 0 2px;font-size:1.25rem}
.paper .addr{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;border-bottom:2px solid var(--blue);padding-bottom:6px;margin-bottom:12px}
.paper .addr b{font-size:1.15rem}
.paper .box{border:2.5px solid var(--red);color:var(--red);font-weight:700;padding:2px 8px;transform:rotate(-3deg);font-size:.9rem;white-space:nowrap}
.paper dl{margin:0}
.paper dt{font-weight:700;margin:12px 0 2px;display:flex;align-items:center;gap:8px}
.paper dd{margin:0;padding-left:.2em}
.paper .fill{margin-top:16px;border-top:1px solid rgba(31,60,158,.4);padding-top:10px}
.paper .fill span{display:block;border-bottom:1.5px dashed var(--blue);height:2em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 30px}

/* ───────── 6 もしものとき（落ち着いて） ───────── */
#s-moshimo .lead{margin:0 18px 14px}
.dateform{margin:0 14px 10px;padding:14px;background:var(--bt);border-radius:8px}
.dateform .btn{margin-top:4px}
.group{margin:22px 14px 0}
.group h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:1.1rem;margin:0;padding:0 2px 6px;border-bottom:2px solid var(--blue)}
.group h2 span{font-size:.95rem}
.task{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:64px;padding:12px 2px;border:0;border-bottom:1px solid rgba(31,60,158,.3);background:none;text-align:left;line-height:1.5}
.task .box{width:30px;height:30px;flex:none;border:2.5px solid var(--blue);border-radius:6px;display:grid;place-items:center;margin-top:1px}
.task[aria-checked="true"] .box{background:var(--blue)}
.task[aria-checked="true"] .box::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.task .t{font-weight:700;display:block}
.task .w{display:block;font-size:.9rem}
.task .done{display:none;font-weight:700;font-size:.85rem;border:1.5px solid currentColor;border-radius:4px;padding:0 6px;margin-left:6px}
.task[aria-checked="true"] .done{display:inline-block}
.readbtn{margin:24px 14px 34px}

/* トースト */
.toast{position:absolute;left:14px;right:14px;bottom:90px;z-index:30;background:var(--blue);color:#fff;padding:14px 16px;border-radius:10px;font-weight:700;display:none;line-height:1.5}
.toast.on{display:block}

@media (prefers-reduced-motion:reduce){
  .press,.press:active{transition:none;transform:none}
}
</style>
</head>
<body>

<!-- 共通の定義：目打ち（切手のギザギザ）と網点 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="perf" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="120">
      <rect width="100" height="120" fill="#fff"/>
      <g id="perf-holes" fill="#000"></g>
    </mask>
    <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.05" fill="#1F3C9E" opacity=".24"/>
    </pattern>
    <pattern id="dotsR" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.05" fill="#C8251B" opacity=".26"/>
    </pattern>
  </defs>
</svg>

<div class="desk">
  <div class="phone-slot" id="slot">
    <div class="phone" id="phone">

      <!-- 1 入口 -->
      <section class="screen" id="s-start" aria-label="はじめる">
        <div class="frame-stripe t" aria-hidden="true"></div>
        <button class="skip press" id="skip" hidden>とばす</button>
        <div class="scroll">
          <div class="start-in">
            <div class="wordmark">のこす手帖</div>
            <div class="poster" aria-hidden="true">
              <div class="p-s2" data-k="stamp"></div>
              <div class="p-env airmail" data-k="env"><div class="in">
                <div class="p-addr">山田 美紀 様</div>
                <div class="p-addr">山田 健一 様</div>
              </div></div>
              <div class="p-s1" data-k="stamp"></div>
              <div class="p-s3" data-k="stamp"></div>
              <div class="p-s4" data-k="stamp"></div>
              <div class="p-pm" data-k="pm"></div>
            </div>
            <h1 class="headline"><span><i>きょうの1問が、</i></span><span><i>家族への1通に。</i></span></h1>
            <div class="after-head">
              <dl class="rates">
                <div><dt>料金</dt><dd>無料</dd></div>
                <div><dt>登録</dt><dd>いりません</dd></div>
                <div><dt>送信</dt><dd>しません。書いたことは、この端末の中だけ</dd></div>
              </dl>
              <button class="btn red wide press" data-go="home">はじめる</button>
            </div>
          </div>
        </div>
        <div class="frame-stripe b" aria-hidden="true"></div>
      </section>

      <!-- 2 ホーム -->
      <section class="screen" id="s-home" aria-label="ホーム">
        <div class="topbar">
          <div class="wordmark">のこす手帖</div>
          <button class="sizebtn press" data-size-toggle>文字<b>大</b></button>
        </div>
        <div class="scroll"><div class="pad">
          <div class="hello">
            <h1>山田 和子さん</h1>
            <div id="home-pm" aria-hidden="true" style="width:120px"></div>
          </div>
          <div class="today" id="today"></div>
          <div class="sec-h"><h2>切手帳</h2><div class="count" id="home-count"></div></div>
          <button class="strip press" id="home-strip" data-go="stock" aria-label="切手帳を開く"></button>
          <div class="links">
            <button data-go="addr" class="press">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="8" width="34" height="24" rx="2" fill="none" stroke="#1F3C9E" stroke-width="2.5"/><rect x="7" y="12" width="5" height="6" fill="none" stroke="#C8251B" stroke-width="1.6"/><rect x="13" y="12" width="5" height="6" fill="none" stroke="#C8251B" stroke-width="1.6"/><path d="M8 24h18M8 28h12" stroke="#1F3C9E" stroke-width="2.5"/></svg>
              <span>誰に・いつ見せるか</span>
              <svg class="chev" width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><path d="M3 3l8 8-8 8" fill="none" stroke="#1F3C9E" stroke-width="3"/></svg>
            </button>
            <button data-go="moshimo" class="press">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="7" width="30" height="28" rx="2" fill="none" stroke="#1F3C9E" stroke-width="2.5"/><path d="M5 14h30M12 4v6M28 4v6" stroke="#1F3C9E" stroke-width="2.5"/><path d="M11 22l3 3 6-6" fill="none" stroke="#1F3C9E" stroke-width="2.5"/></svg>
              <span>もしものとき</span>
              <svg class="chev" width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><path d="M3 3l8 8-8 8" fill="none" stroke="#1F3C9E" stroke-width="3"/></svg>
            </button>
          </div>
        </div></div>
        <nav class="tabs" data-tabs></nav>
      </section>

      <!-- 3 書く -->
      <section class="screen" id="s-write" aria-label="1問ずつ書く">
        <div class="whead">
          <button class="back press" data-act="w-back" aria-label="戻る"><svg width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><path d="M11 3L3 11l8 8" fill="none" stroke="#1F3C9E" stroke-width="3"/></svg></button>
          <div class="where" id="w-where"></div>
          <div class="tally" id="w-tally" aria-live="polite"></div>
        </div>
        <div class="scroll" id="w-scroll">
          <div class="wq">
            <p class="label" id="w-label"></p>
            <h1 id="w-title"></h1>
            <p class="hint" id="w-hint"></p>
          </div>
          <div class="binsen" id="w-form"></div>
        </div>
        <div class="wfoot">
          <button class="btn press" data-act="w-back">戻る</button>
          <button class="btn ghost press" data-act="w-later">あとで</button>
          <button class="btn red press" data-act="w-save" id="w-save">保存する</button>
        </div>
      </section>

      <!-- 4 封をする -->
      <section class="screen" id="s-seal" aria-label="保存しました">
        <div class="frame-stripe t" aria-hidden="true"></div>
        <div class="stage">
          <div class="env-wrap" aria-hidden="true">
            <div class="env" id="env">
              <div class="back">
                <div class="inside"></div>
                <div class="letter" id="letter"></div>
                <svg class="pocket" viewBox="0 0 300 196"><path d="M1.5 1.5 L150 104 L298.5 1.5 V194.5 H1.5 Z" fill="#fff" stroke="#1F3C9E" stroke-width="2.5" stroke-linejoin="round"/><path d="M1.5 194.5 L118 86 M298.5 194.5 L182 86" stroke="#1F3C9E" stroke-width="1.5" opacity=".5"/></svg>
                <svg class="flap" id="flap" viewBox="0 0 300 196"><path d="M1.5 1.5 L150 116 L298.5 1.5 Z" fill="#fff" stroke="#1F3C9E" stroke-width="2.5" stroke-linejoin="round"/></svg>
              </div>
              <div class="front">
                <div class="airmail"><div class="in" id="env-to"></div></div>
                <div class="stamp-on" id="stamp-on"></div>
                <div class="pm-on" id="pm-on"></div>
              </div>
            </div>
          </div>
          <div class="seal-done" id="seal-done" role="status">
            <h1>1通、のこしました。</h1>
            <p>切手帳の <b id="seal-n">13</b> 枚目です。</p>
            <div class="row">
              <button class="btn red wide press" data-act="next-q">もう1問書く</button>
              <button class="btn wide press" data-go="home">ホームへ</button>
            </div>
          </div>
        </div>
        <div class="frame-stripe b" aria-hidden="true"></div>
      </section>

      <!-- 切手帳 -->
      <section class="screen" id="s-stock" aria-label="切手帳">
        <div class="topbar">
          <div class="wordmark">のこす手帖</div>
          <button class="sizebtn press" data-size-toggle>文字<b>大</b></button>
        </div>
        <div class="page-h"><h1>切手帳</h1><div class="count" id="stock-count"></div></div>
        <div class="scroll"><div class="book" id="book"></div></div>
        <nav class="tabs" data-tabs></nav>
      </section>

      <!-- 5 誰に・いつ見せるか -->
      <section class="screen" id="s-addr" aria-label="誰に・いつ見せるか">
        <div class="topbar">
          <div class="wordmark">のこす手帖</div>
          <button class="sizebtn press" data-size-toggle>文字<b>大</b></button>
        </div>
        <div class="page-h"><h1>誰に・いつ見せるか</h1></div>
        <div class="scroll">
          <div class="people" id="people"></div>
          <p class="who-line" id="who-line"></p>
          <div class="rows" id="addr-rows"></div>
          <div class="sheet-btn"><button class="btn blue wide press" data-go="sheet">受け渡しシートの見本</button></div>
        </div>
        <nav class="tabs" data-tabs></nav>
      </section>

      <!-- 5b 受け渡しシート -->
      <section class="screen" id="s-sheet" aria-label="受け渡しシートの見本">
        <div class="whead">
          <button class="back press" data-go="addr" aria-label="戻る"><svg width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><path d="M11 3L3 11l8 8" fill="none" stroke="#1F3C9E" stroke-width="3"/></svg></button>
          <div class="where">受け渡しシートの見本</div>
        </div>
        <div class="scroll">
          <div class="paper" id="paper"></div>
          <div class="two">
            <button class="btn red press" data-act="print">印刷する</button>
            <button class="btn press" data-act="file">ファイルで渡す</button>
          </div>
        </div>
      </section>

      <!-- 6 もしものとき -->
      <section class="screen" id="s-moshimo" aria-label="もしものとき">
        <div class="topbar">
          <div class="wordmark">のこす手帖</div>
          <button class="sizebtn press" data-size-toggle>文字<b>大</b></button>
        </div>
        <div class="page-h"><h1>もしものとき</h1></div>
        <div class="scroll">
          <p class="lead">和子さんの手帖を、書き換えずに読めます。</p>
          <form class="dateform" id="dateform">
            <div class="field">
              <label for="death">亡くなった日</label>
              <input type="date" id="death" required>
            </div>
            <button class="btn blue wide press" type="submit">期限を出す</button>
          </form>
          <div id="tasks" aria-live="polite"></div>
          <div class="readbtn"><button class="btn wide press" data-act="read">手帖を読む</button></div>
        </div>
        <nav class="tabs" data-tabs></nav>
      </section>

      <div class="overlay" id="ov"><div class="dim" data-act="close-ov"></div><div class="bsheet" id="bsheet" role="dialog" aria-modal="true" aria-labelledby="bs-h"></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <aside class="panel" aria-label="試作の操作">
    <h1>のこす手帖<br>試作B 封筒と切手</h1>
    <div>
      <h2 style="margin-bottom:8px">画面</h2>
      <ol id="nav">
        <li><button data-p="start"><span class="n">1</span>入口</button></li>
        <li><button data-p="home"><span class="n">2</span>ホーム</button></li>
        <li><button data-p="write"><span class="n">3</span>1問ずつ書く</button></li>
        <li><button data-p="seal"><span class="n">4</span>保存した瞬間</button></li>
        <li><button data-p="addr"><span class="n">5</span>誰に・いつ見せるか</button></li>
        <li><button data-p="sheet"><span class="n">5</span>受け渡しシート</button></li>
        <li><button data-p="moshimo"><span class="n">6</span>もしものとき</button></li>
        <li><button data-p="stock"><span class="n">+</span>切手帳</button></li>
      </ol>
    </div>
    <div>
      <h2 style="margin-bottom:8px">文字の大きさ</h2>
      <div class="seg"><button data-size="std" aria-pressed="true">標準</button><button data-size="lg" aria-pressed="false">大</button></div>
    </div>
    <button class="plain" id="replay">オープニングをもう一度</button>
  </aside>
</div>

  [env, letter, flap, stamp, pm, done, back, front].forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
  back.style.display = ''; front.style.display = 'none';
  letter.style.transform = ''; flap.style.transform = ''; stamp.style.opacity = '0'; pm.style.opacity = '0'; done.style.opacity = '0';
  go('seal');
  const A = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;

  if (reduce.matches) {
    // 移動・拡大はせず、フェードだけで「封をした」状態へ
    letter.style.transform = 'translateY(150px)'; flap.style.transform = 'scaleY(1)';
    await A(back, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 500 });
    back.style.display = 'none'; front.style.display = 'block';
    await A(front, [{ opacity: 0 }, { opacity: 1 }], { duration: 350 });
    stamp.style.opacity = '1'; await A(stamp, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    pm.style.opacity = '1'; await A(pm, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    await A(done, [{ opacity: 0 }, { opacity: 1 }], { duration: 350 });
    done.style.opacity = '1'; sealing = false; $('button', done).focus({ preventScroll: true }); return;
  }
  await new Promise((r) => setTimeout(r, 180));
  // 1 便箋が封筒に入る
  await A(letter, [{ transform: 'translateY(0)' }, { transform: 'translateY(150px)' }], { duration: 560, easing: 'cubic-bezier(.55,0,.25,1)' });
  // 2 ふたが閉じる
  await A(flap, [{ transform: 'scaleY(-1)' }, { transform: 'scaleY(1)' }], { duration: 340, easing: 'cubic-bezier(.6,0,.3,1)' });
  // 3 封筒を返して表へ
  await A(env, [{ transform: 'rotateY(0)' }, { transform: 'rotateY(90deg)' }], { duration: 200, easing: 'ease-in' });
  back.style.display = 'none'; front.style.display = 'block';
  await A(env, [{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0)' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.3,1)' });
  // 4 切手を貼る
  stamp.style.opacity = '1';
  await A(stamp, [
    { transform: 'translate(-40px,-70px) scale(1.8) rotate(-16deg)', opacity: 0 },
    { opacity: 1, offset: .35 },
    { transform: 'translate(0,0) scale(.9) rotate(-1deg)', offset: .72 },
    { transform: 'translate(0,0) scale(1) rotate(-3deg)', opacity: 1 }], { duration: 440, easing: 'cubic-bezier(.3,.6,.3,1)' });
  // 5 消印を「ポン」
  pm.style.opacity = '1';
  if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
  const waves = $$('.wave', pm);
  waves.forEach((w) => { w.style.strokeDasharray = '400'; });
  await Promise.all([
    A(pm, [{ transform: 'scale(1.45)', opacity: 0 }, { transform: 'scale(.95)', opacity: 1, offset: .5 }, { transform: 'scale(1)', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.5,0,.3,1)' }),
    A(env, [{ transform: 'scale(1)' }, { transform: 'scale(1.03,.94)', offset: .35 }, { transform: 'scale(1)' }], { duration: 380, delay: 120, easing: 'ease-out' }),
    ...waves.map((w) => A(w, [{ strokeDashoffset: 400 }, { strokeDashoffset: 0 }], { duration: 420, delay: 90, easing: 'ease-out' })),
  ]);
  // 6 ひとこと
  await A(done, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,.7,.2,1)' });
  done.style.opacity = '1';
  sealing = false;
  $('button', done).focus({ preventScroll: true });
}

/* 続けて書くときの「次へ」：数が1つ増えて、ばねで弾む */
function saveAndNext() {
  const q = Q[S.cur];
  if (!S.done.has(q.i)) { S.done.set(q.i, readAnswer() || '（見本）'); S.order.push(q.i); }
  const num = $('#w-num'); if (num) num.textContent = S.done.size;
  if (!reduce.matches) $('#w-tally').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)', offset: .3 }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3,1.6,.5,1)' });
  const nx = nextUnanswered(q.i);
  if (nx < 0) { toast('46問すべて書きました。'); go('home'); return; }
  S.trail.push(S.cur); S.cur = nx;
  setTimeout(() => {
    renderWrite();
    const sc = $('#w-scroll'); sc.scrollTop = 0;
    sc.animate(reduce.matches ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  }, reduce.matches ? 0 : 160);
}

/* ───────── もしものとき：期限（app/js/logic.js と同じ数え方） ───────── */
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return { y, m, d }; };
const fromUTC = (t) => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (k, n) => { const { y, m, d } = parse(k); return fromUTC(Date.UTC(y, m - 1, d + n)); };
function monthsDeadline(k, n) {
  const s = addDays(k, 1); const { y, m, d } = parse(s);
  const last = new Date(Date.UTC(y, m - 1 + n + 1, 0)).getUTCDate();
  if (d > last) return fromUTC(Date.UTC(y, m - 1 + n, last));
  return addDays(fromUTC(Date.UTC(y, m - 1 + n, d)), -1);
}
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
const ja = (k) => { const { y, m, d } = parse(k); return `${y}年${m}月${d}日（${WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}）`; };
const GROUPS = [
  { label: '7日以内', due: (k) => addDays(k, 6), tasks: [['死亡届を出す', '市区町村役場。葬儀社が代わりに出してくれることもあります'], ['火葬許可を申請する', '市区町村役場（死亡届と同時に）']] },
  { label: '14日以内', due: (k) => addDays(k, 13), tasks: [['年金の受給を止める', `年金事務所。厚生年金は10日以内（${'{p10}'}まで）`], ['健康保険の資格喪失の手続きをする', '市区町村役場'], ['世帯主の変更届を出す', '市区町村役場。残る世帯員が2人以上のとき']] },
  { label: '3か月以内', due: (k) => monthsDeadline(k, 3), tasks: [['相続放棄・限定承認をするか決める', '家庭裁判所']] },
  { label: '4か月以内', due: (k) => monthsDeadline(k, 4), tasks: [['準確定申告をする', '亡くなった方の住所地の税務署']] },
  { label: '10か月以内', due: (k) => monthsDeadline(k, 10), tasks: [['相続税の申告と納付をする（必要な場合）', '亡くなった方の住所地の税務署']] },
];
function renderTasks(k) {
  const p10 = ja(addDays(k, 9)).replace(/^\d+年/, '');
  $('#tasks').innerHTML = GROUPS.map((g, gi) => `<section class="group"><h2>${g.label}<span>${ja(g.due(k))}まで</span></h2>
    ${g.tasks.map(([t, w], ti) => { const id = `${gi}-${ti}`; return `<button class="task" role="checkbox" aria-checked="${S.checked.has(id)}" data-act="task" data-id="${id}">
      <span class="box" aria-hidden="true"></span><span><span class="t">${t}<span class="done">済み</span></span><span class="w">${w.replace('{p10}', p10)}</span></span></button>`; }).join('')}</section>`).join('');
}

/* ───────── 入口のオープニング（3秒以内・初回だけ・とばせる） ───────── */
let opening = [];
function buildPoster() {
  const p = $('#s-start .poster');
  $('.p-s1', p).innerHTML = stampSVG('words', 3, 86);
  $('.p-s2', p).innerHTML = stampSVG('money', 1, 92);
  $('.p-s3', p).innerHTML = stampSVG('pet', 1, 80);
  $('.p-s4', p).innerHTML = stampSVG('insurance', 2, 84);
  $('.p-pm', p).innerHTML = postmarkSVG(210, true);
}
function playOpening() {
  go('start');
  const scr = $('#s-start'); const skip = $('#skip');
  opening.forEach((a) => a.cancel()); opening = [];
  skip.hidden = false;
  const add = (el, kf, o) => { const a = el.animate(kf, { fill: 'backwards', easing: 'cubic-bezier(.2,.8,.2,1)', ...o }); opening.push(a); return a; };
  const env = $('.p-env', scr), pm = $('.p-pm', scr);
  const heads = $$('.headline i', scr), after = $('.after-head', scr), stripes = $$('.frame-stripe', scr);
  const drops = [['.p-s2', 300, -14], ['.p-s1', 520, 3], ['.p-s3', 740, 9], ['.p-s4', 940, -8]];
  if (reduce.matches) {
    add(env, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
    drops.forEach(([s, t]) => add($(s, scr), [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: t }));
    add(pm, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 1150 });
    heads.forEach((h, i) => add(h, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 1450 + i * 150 }));
    add(after, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 2000 });
  } else {
    stripes.forEach((s, i) => add(s, [{ transform: `translateX(${i ? '' : '-'}100%)` }, { transform: 'none' }], { duration: 420 }));
    add(env, [{ transform: 'translate(120px,260px) rotate(18deg)', opacity: 0 }, { opacity: 1, offset: .3 }, { transform: 'rotate(-5deg)', opacity: 1 }], { duration: 560, delay: 60, easing: 'cubic-bezier(.2,.9,.25,1.08)' });
    drops.forEach(([s, t, r]) => add($(s, scr), [
      { transform: `scale(1.9) rotate(${r - 20}deg)`, opacity: 0 }, { opacity: 1, offset: .3 },
      { transform: `scale(.9) rotate(${r}deg)`, offset: .7 }, { transform: `scale(1) rotate(${r}deg)`, opacity: 1 }], { duration: 340, delay: t, easing: 'cubic-bezier(.4,0,.3,1)' }));
    add(pm, [{ transform: 'scale(1.5) rotate(-8deg)', opacity: 0 }, { transform: 'scale(.95) rotate(-8deg)', opacity: 1, offset: .5 }, { transform: 'scale(1) rotate(-8deg)', opacity: 1 }], { duration: 300, delay: 1180, easing: 'cubic-bezier(.5,0,.3,1)' });
    add($('.poster', scr), [{ transform: 'none' }, { transform: 'translateY(4px) scaleY(.985)', offset: .4 }, { transform: 'none' }], { duration: 300, delay: 1260, fill: 'none' });
    heads.forEach((h, i) => add(h, [{ transform: 'translateY(105%)' }, { transform: 'none' }], { duration: 480, delay: 1480 + i * 140 }));
    add(after, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 2080 });
  }
  const end = () => { skip.hidden = true; try { localStorage.setItem('nokosu-post-opened', '1'); } catch (e) {} };
  Promise.all(opening.map((a) => a.finished)).then(end, () => {});
  if (opening.length) opening[opening.length - 1].finished.then(end, () => {});
}
function skipOpening() { opening.forEach((a) => { try { a.finish(); } catch (e) {} }); $('#skip').hidden = true; try { localStorage.setItem('nokosu-post-opened', '1'); } catch (e) {} }

/* ───────── 下から出るシート（時期を選ぶ） ───────── */
let lastFocus = null;
function openStageSheet(cat) {
  lastFocus = document.activeElement;
  const p = PEOPLE[S.person]; const cur = S.stages[S.person][cat];
  $('#bsheet').innerHTML = `<h2 id="bs-h">${catName(cat)}を、${p.short}さんに<br>いつ見せますか</h2>
    <div role="radiogroup" aria-labelledby="bs-h">${STAGES.map((s) => `<button class="opt press" role="radio" aria-checked="${s.id === cur}" data-act="pick-stage" data-c="${cat}" data-s="${s.id}"><span class="mk" aria-hidden="true"></span>${s.label}</button>`).join('')}</div>
    <button class="btn wide press" data-act="close-ov" style="margin-top:4px">閉じる</button>`;
  const ov = $('#ov'); ov.classList.add('on');
  $('.bsheet', ov).animate(reduce.matches ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
  $('.dim', ov).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 });
  $('.opt[aria-checked="true"]', ov)?.focus();
}
function closeSheet() { $('#ov').classList.remove('on'); lastFocus && lastFocus.focus && lastFocus.focus(); }

function peek(i) {
  lastFocus = document.activeElement;
  const q = Q[i];
  $('#bsheet').innerHTML = `<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:10px">${stampSVG(q.cat, q.n, 64)}<div><p style="margin:0;font-weight:700">${catName(q.cat)}</p><h2 id="bs-h" style="margin:0">${esc(q.title)}</h2></div></div>
    <div class="binsen" style="margin:0 0 14px"><p style="margin:0">${esc(S.done.get(i) || '')}</p></div>
    <button class="btn wide press" data-act="close-ov">閉じる</button>`;
  $('#ov').classList.add('on');
  $('#bsheet').animate(reduce.matches ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
  $('#bsheet .btn').focus();
}

/* トースト（3秒で消える） */
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(hideToast, 3000); }
function hideToast() { $('#toast').classList.remove('on'); }

/* 文字の大きさ */
function setSize(sz) {
  document.documentElement.dataset.size = sz;
  $$('.panel .seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.size === sz)));
  $$('[data-size-toggle]').forEach((b) => { b.innerHTML = sz === 'lg' ? '文字<b>標準</b>' : '文字<b>大</b>'; b.setAttribute('aria-label', sz === 'lg' ? '文字を標準にする' : '文字を大きくする'); });
  try { localStorage.setItem('nokosu-post-size', sz); } catch (e) {}
}

/* ───────── 操作 ───────── */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-act]');
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.hasAttribute('data-size-toggle')) { setSize(document.documentElement.dataset.size === 'lg' ? 'std' : 'lg'); return; }
  if (t.dataset.size) { setSize(t.dataset.size); return; }
  if (t.dataset.chip) {
    const grp = t.parentElement;
    if (t.dataset.chip === 'one') $$('.chip', grp).forEach((c) => c.setAttribute('aria-checked', String(c === t)));
    else t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true'));
    return;
  }
  if (t.dataset.p) { panelGo(t.dataset.p); return; }
  switch (t.dataset.act) {
    case 'write-today': S.mode = 'today'; S.cur = S.today; S.trail = []; go('write'); break;
    case 'next-q': { const nx = nextUnanswered(S.today); if (nx < 0) { go('home'); break; } S.mode = 'more'; S.trail = []; S.cur = nx; go('write'); break; }
    case 'open-q': S.mode = Number(t.dataset.q) === S.today && !S.todaySaved ? 'today' : 'more'; S.cur = Number(t.dataset.q); S.trail = []; go('write'); break;
    case 'w-save':
      if (S.mode === 'today') seal(readAnswer()); else saveAndNext();
      break;
    case 'w-back':
      if (S.trail.length) { S.cur = S.trail.pop(); renderWrite(); } else go('home');
      break;
    case 'w-later': toast('この問いは、あとで書く問いに入れました。'); setTimeout(() => go(S.mode === 'today' ? 'home' : 'home'), 900); break;
    case 'person': S.person = Number(t.dataset.i); RENDER.addr(); $$('.person')[S.person].focus(); break;
    case 'stage': openStageSheet(t.dataset.c); break;
    case 'pick-stage': {
      S.stages[S.person][t.dataset.c] = t.dataset.s;
      $$('.opt', $('#bsheet')).forEach((o) => o.setAttribute('aria-checked', String(o === t)));
      RENDER.addr();
      setTimeout(() => { closeSheet(); const r = $(`#addr-rows [data-c="${t.dataset.c}"]`); r && r.focus(); }, reduce.matches ? 150 : 260);
      break;
    }
    case 'close-ov': closeSheet(); break;
    case 'peek': peek(Number(t.dataset.q)); break;
    case 'print': toast('見本なので、印刷はしません。'); break;
    case 'file': toast('見本なので、ファイルは作りません。'); break;
    case 'read': toast('見本なので、手帖はここまでです。'); break;
    case 'task': { const id = t.dataset.id; const on = !S.checked.has(id); on ? S.checked.add(id) : S.checked.delete(id); t.setAttribute('aria-checked', String(on)); break; }
  }
});
$('#skip').addEventListener('click', (e) => { e.stopPropagation(); skipOpening(); });
$('#s-start').addEventListener('pointerdown', (e) => { if (!$('#skip').hidden && !e.target.closest('#skip')) skipOpening(); });
$('#replay').addEventListener('click', () => playOpening());
$('#dateform').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#death').value; if (v) renderTasks(v); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#ov').classList.contains('on')) closeSheet(); });

function panelGo(p) {
  if (p === 'start') { buildPoster(); go('start'); return; }
  if (p === 'write') { S.mode = S.todaySaved ? 'more' : 'today'; S.cur = S.todaySaved ? nextUnanswered(S.today) : S.today; S.trail = []; go('write'); return; }
  if (p === 'seal') { S.mode = 'today'; S.cur = S.today; seal(S.done.get(S.today) || '通帳・キャッシュカード／居間のたんす 右上の引き出し'); return; }
  go(p);
}

/* PC：スマホの枠を画面の高さに合わせて縮める */
function fit() {
  const slot = $('#slot'), ph = $('#phone');
  if (innerWidth <= 760) { slot.style.width = ''; slot.style.height = ''; ph.style.transform = ''; return; }
  const s = Math.min(1, (innerHeight - 40) / 850);
  slot.style.width = 390 * s + 'px'; slot.style.height = 844 * s + 'px';
  ph.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* はじめ */
let sz = 'std'; try { sz = localStorage.getItem('nokosu-post-size') || 'std'; } catch (e) {}
const qs = new URLSearchParams(location.search);
if (qs.get('size')) sz = qs.get('size');
setSize(sz);
buildPoster();
const startAt = qs.get('s');
let seen = false; try { seen = localStorage.getItem('nokosu-post-opened') === '1'; } catch (e) {}
if (startAt) { if (startAt === 'opening') playOpening(); else panelGo(startAt); }
else if (!seen) playOpening();
else go('start');
if (qs.get('task') && startAt === 'moshimo') { $('#dateform').requestSubmit(); }
})();
</script>
